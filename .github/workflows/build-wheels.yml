name: Build-Wheels


on:
  workflow_call:

    inputs:

      commit_sha:
        required: true
        type: string

      is_pure_py:
        required: true
        type: string


jobs:

  build-wheels-pure:
    if: inputs.is_pure_py == 'true'
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - run: |
          pip install build
          python -m build --wheel --outdir ../temp_wheels
      
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ../temp_wheels/*.whl


  build-wheels:
    if: inputs.is_pure_py == 'false'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]    
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          submodules: recursive

      - uses: docker/setup-qemu-action@v3
        if: matrix.os == 'ubuntu-latest'

      - uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: cp312-win_amd64 cp312-manylinux_x86_64 cp313-win_amd64 cp313-manylinux_x86_64 cp314-win_amd64 cp314-manylinux_x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

