
name: Nightly Build Reusable Pipeline

on:
  workflow_call:
    secrets:
      PYPI_API_TOKEN:
        required: true
        description: "The authentication token for PyPI publishing."

jobs:

  scan-changes:
    uses: ./.github/workflows/scan-changes.yml

  prepare-version:
    needs: scan-changes
    if: needs.scan-changes.outputs.has_changes == 'true'
    uses: ./.github/workflows/prepare-version.yml

  build-wheels:
    needs: prepare-version
    uses: ./.github/workflows/build-wheels.yml
    with:
      commit_sha: ${{ needs.prepare-version.outputs.commit_sha }}

  publish:
    needs: [prepare-version, build-wheels]
    uses: ./.github/workflows/publish.yml
    with:
      commit_sha: ${{ needs.prepare-version.outputs.commit_sha }}
      version_iso: ${{ needs.prepare-version.outputs.version_iso }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }} 

